<title>Sales</title>
<style>
:root{color-scheme:light dark;
--page:light-dark(#f8f8f6,#0b0b0d);--card:light-dark(#fff,#141417);--soft:light-dark(#f1f1ef,#1c1c20);
--ink:light-dark(#17171a,#f3f3f5);--ink2:light-dark(#48484d,#c4c4ca);--muted:light-dark(#66666d,#8c8c95);
--line:light-dark(rgb(0 0 0/.075),rgb(255 255 255/.08));--line2:light-dark(rgb(0 0 0/.14),rgb(255 255 255/.16));
--accent:light-dark(#3e63dd,#7b96ff);--money:light-dark(#0f7f57,#34c48b);--up:var(--money);
--down:light-dark(#d23f45,#ff6b70);--warn:light-dark(#c98a00,#f6b100);--tip:#1f2530;
--shadow:0 1px 2px rgb(0 0 0/.04),0 1px 1px rgb(0 0 0/.02)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.4 -apple-system,"SF Pro Text","Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:24px 32px 40px}
@media(min-width:1800px){.wrap{max-width:1640px}}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}
.chip{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px}
.sp{flex:1}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);padding:5px 12px;border-radius:8px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.seg button:focus-visible,.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.theme:hover{background:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:10px}
.tile .top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:4px 8px 10px}
.tile .top span:last-child{color:var(--muted)}
.inner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;box-shadow:var(--shadow)}
.num{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.num b{font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.num small{font-size:13px;color:var(--muted)}
.ticks{display:flex;gap:3px;height:28px;margin:14px 0 10px}
.ticks i{flex:1;border-radius:1px;background:var(--line2);min-width:2px}
.ticks i.on{background:var(--c)}
.ticks i.mk{background:var(--ink);flex:0 0 3px;margin:0 1px;transform:scaleY(1.25)}
.foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.foot b{font-weight:500;color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0}
.strip>div{padding:16px 20px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0;padding-left:8px}
.strip .l{font-size:13px;color:var(--ink2)}
.strip .v{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:2px 0 0}
.strip .v b{font-size:26px;font-weight:500;letter-spacing:-.02em}
.pill{white-space:nowrap;font-size:12px;font-weight:500;border-radius:999px;padding:1px 7px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.grid{display:grid;grid-template-columns:7fr 5fr;gap:16px;margin-bottom:16px}.grid.g2{grid-template-columns:5fr 7fr}.grid>*,.tiles>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.card h2{font-size:14px;font-weight:500;color:var(--ink2);margin:0 0 6px;display:flex;justify-content:space-between}
.card h2 .k{color:var(--muted);font-weight:400;font-size:13px}
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.big b{font-size:26px;font-weight:500;letter-spacing:-.02em}
#chart{position:relative;height:250px}
#chart svg{width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;background:var(--tip);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .08s}
#tip s{text-decoration:none;color:#9aa4b5;display:block}
.mv{display:grid;gap:18px;margin-top:6px}
.mv .row .h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.mv .row .h b{font-weight:500}
.trk{height:15px;border-radius:8px;background:var(--line);overflow:hidden}
.trk i{display:block;height:100%;border-radius:8px;background:repeating-linear-gradient(45deg,var(--c) 0 2px,transparent 2px 5px),color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.list .r{position:relative;display:grid;grid-template-columns:1fr auto 52px;gap:12px;padding:11px 0 13px;font-size:14px;border-bottom:1px solid transparent}
.list .r span:nth-child(2){font-weight:500}
.list .r span:nth-child(3){text-align:right;color:var(--muted)}
.list .r:after{content:"";position:absolute;left:0;bottom:4px;height:3px;border-radius:2px;width:var(--w);background:var(--c)}
.list .r:before{content:"";position:absolute;left:0;right:0;bottom:4px;height:3px;border-radius:2px;background:var(--line)}
.list .r:after{z-index:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:8px 0;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:11px 0;text-align:right;border-bottom:1px solid var(--line)}
tfoot td{font-weight:500;border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-right:9px}
@media(max-width:1100px){.grid,.grid.g2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}.strip{grid-template-columns:repeat(2,1fr)}.strip>div{border-top:1px solid var(--line)}}
@media(max-width:560px){.strip .v b{font-size:22px}.strip>div{padding:14px 12px}.wrap{padding:16px}.tiles{grid-template-columns:1fr}.strip{grid-template-columns:1fr 1fr}.num b{font-size:30px}}
</style></head>
